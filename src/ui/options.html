<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TabPilot 设置</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1b1b1f;
    --bg: #ffffff;
    --muted: #5f6368;
    --border: #d7d9dd;
    --accent: #2563eb;
    --ok: #1a7f37;
    --warn: #9a6700;
    --error: #c62828;
    --panel: #f6f7f9;
    --panel-strong: #eef0f3;
    --surface: rgba(255, 255, 255, 0.72);
    --divider: #c8c2dc;
    --card-bg: rgba(247, 241, 255, 0.92);
    --card-border: #d9cdf1;
    --card-shadow: 0 1px 3px rgba(45, 30, 90, 0.06);
    --btn-bg: rgba(255, 255, 255, 0.92);
    --btn-shadow: 0 1px 2px rgba(42, 30, 82, 0.12);
    --btn-shadow-hover: 0 4px 12px rgba(70, 45, 140, 0.18);
    --mini-btn-bg-hover: rgba(255, 255, 255, 0.92);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e6e6e9;
      --bg: #1c1c1f;
      --muted: #a0a0a8;
      --border: #3a3b40;
      --accent: #7aa2ff;
      --ok: #5fd18b;
      --warn: #e5c07b;
      --error: #ff7b72;
      --panel: #242428;
      --panel-strong: #2c2c31;
      --surface: rgba(255, 255, 255, 0.07);
      --divider: #4b4560;
      --card-bg: rgba(255, 255, 255, 0.055);
      --card-border: #403a55;
      --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
      --btn-bg: rgba(255, 255, 255, 0.08);
      --btn-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      --btn-shadow-hover: 0 4px 12px rgba(0, 0, 0, 0.5);
      --mini-btn-bg-hover: rgba(255, 255, 255, 0.14);
    }
  }

  /* 始终为滚动条预留空间，页面出现纵向滚动时内容不会横向抖动 */
  html { scrollbar-gutter: stable; }
  @supports not (scrollbar-gutter: stable) {
    html { overflow-y: scroll; }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 26px 20px 64px;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
  }
  main { max-width: 1040px; margin: 0 auto; }

  header { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0; }
  .version { color: var(--muted); font-size: 13px; }

  button {
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--btn-bg);
    box-shadow: var(--btn-shadow);
    color: inherit;
    font: inherit;
    cursor: pointer;
    transition: box-shadow 0.16s ease, transform 0.16s ease, border-color 0.16s ease;
  }
  button:hover:not(:disabled) {
    border-color: var(--accent);
    box-shadow: var(--btn-shadow-hover);
    transform: translateY(-1px);
  }
  button:active:not(:disabled) { transform: translateY(0); box-shadow: var(--btn-shadow); }
  button:disabled { opacity: 0.5; cursor: default; box-shadow: none; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 3px 10px rgba(37, 99, 235, 0.32);
  }
  button.primary:hover:not(:disabled) {
    filter: brightness(1.06);
    box-shadow: 0 5px 16px rgba(37, 99, 235, 0.42);
  }
  button.icon { padding: 3px 9px; line-height: 1.2; }

  /* 区块标题：hover 也不要有阴影 / 边框 / 位移，只保留文字变色 */
  button.section-head,
  button.section-head:hover:not(:disabled),
  button.section-head:active:not(:disabled) {
    background: transparent;
    border: 0;
    box-shadow: none;
    transform: none;
  }

  /* 结构性按钮（区块标题、菜单项、颜色选择、小图标）保持扁平，不参与抬升 */
  .section-head,
  .color-select,
  .color-option,
  .title-rule-move,
  .title-rule-remove,
  .group-row .menu-toggle,
  button.icon {
    box-shadow: none;
    transform: none;
  }
  .section-head:hover,
  .color-select:hover,
  .color-option:hover,
  .title-rule-move:hover:not(:disabled),
  .title-rule-remove:hover,
  .group-row .menu-toggle:hover:not(:disabled),
  button.icon:hover:not(:disabled) {
    transform: none;
    box-shadow: none;
  }
  button.icon { background: transparent; }
  .group-row .menu-toggle { background: transparent; }

  /* 顶部工具栏：一条横栏，不加卡片边框 */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--divider);
  }
  .toolbar .spacer { flex: 1 1 40px; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .switch input { width: 16px; height: 16px; margin: 0; }

  /* 缺少 host 权限时的提示：全局配置里有一块权限区域，分组详情里按开关显示 */
  .hint.small.permission-warning { color: var(--error); }
  .permission-config { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--divider); }

  /* 整体分栏：左侧分组列表 + 右侧详情，中间一条竖线 */
  .layout {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
  }
  .groups {
    min-width: 0;
    padding: 16px 20px 8px 0;
    border-right: 1px solid var(--divider);
  }
  .detail {
    min-width: 0;
    padding: 16px 0 8px 24px;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .groups {
      border-right: 0;
      border-bottom: 1px solid var(--divider);
      padding: 16px 0 12px;
    }
    .detail { padding: 16px 0 8px; }
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .add-rule-control { position: relative; }
  .add-rule-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 20;
    min-width: 230px;
    max-width: min(340px, calc(100vw - 40px));
    padding: 5px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    box-shadow: 0 6px 20px #0002;
  }
  .add-rule-menu[hidden] { display: none; }
  .add-rule-menu button { display: block; width: 100%; text-align: left; border: 0; box-shadow: none; background: transparent; }
  .add-rule-menu button:hover { background: var(--panel); transform: none; }
  .panel-head h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }

  /* 全局配置单独置顶，与分组列表用分隔线隔开 */
  .global-list {
    list-style: none;
    margin: 0 0 12px;
    padding: 0 0 12px;
    border-bottom: 1px solid var(--divider);
  }
  .global-item .group-name { font-weight: 600; }

  .global-actions { display: flex; gap: 8px; margin: 10px 0 6px; }
  .global-actions button { flex: 1 1 auto; padding: 6px 8px; font-size: 12px; }
  .global-config { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--divider); }

  /* ---------- 左栏：分组列表（列表行，不是卡片） ---------- */
  .group-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .group-item { border-radius: 6px; }
  .group-list .group-row[draggable="true"] { cursor: grab; }
  .group-list .group-row[draggable="true"] .group-name { cursor: inherit; }
  .group-item.dragging { opacity: 0.45; }
  .group-item { position: relative; }
  .group-item.drop-before::before,
  .group-item.drop-after::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    border-radius: 1px;
    background: var(--accent);
    pointer-events: none;
  }
  .group-item.drop-before::before { top: -1px; }
  .group-item.drop-after::after { bottom: -1px; }
  .group-item:hover { background: var(--panel); }
  .group-item.selected { background: var(--panel-strong); box-shadow: inset 2px 0 0 var(--accent); }
  .group-item.invalid { box-shadow: inset 2px 0 0 var(--error); background: transparent; }
  .group-item.disabled .group-name { color: var(--muted); text-decoration: line-through; }
  .group-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; }
  .group-row .swatch {
    flex: none;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    border: 1px solid rgba(0, 0, 0, 0.18);
  }
  .group-name {
    flex: 1 1 auto;
    min-width: 0;
    padding: 2px 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
  }
  .group-row .menu-toggle {
    flex: none;
    padding: 2px 7px;
    border-color: transparent;
    background: transparent;
    color: var(--muted);
  }
  .group-row .menu-toggle:hover:not(:disabled) { border-color: var(--border); }
  .group-menu { display: flex; gap: 6px; padding: 0 8px 8px 30px; }
  .group-menu[hidden] { display: none; }
  .group-menu button { flex: 1 1 auto; padding: 5px 6px; font-size: 12px; }
  .group-menu button.delete { color: var(--error); }

  .hint { color: var(--muted); font-size: 12.5px; margin: 0; }
  .hint.small { font-size: 12px; margin-top: 10px; }
  .hint code { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  /* 导出被未保存修改挡住时的提示：用错误色，比普通 hint 更醒目 */
  .hint.small.export-blocked { color: var(--error); }

  /* ---------- 右栏：分组详情 ---------- */
  .detail-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .detail-head h2 { margin: 0; font-size: 16px; }
  .detail-head .muted { color: var(--muted); font-size: 12.5px; }

  /* 第一行：分组名 + 颜色 + 阈值 */
  .detail-row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 12px;
    margin-bottom: 14px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .field-name { flex: 0 1 240px; min-width: 140px; }
  .field-language { flex: 1 1 220px; min-width: 180px; }
  .field-click-action { flex: 1 1 320px; min-width: 220px; }
  .global-switch-cards {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-auto-rows: 1fr;
    gap: 12px;
    margin: 16px 0;
  }
  .global-switch-card {
    box-sizing: border-box;
    min-width: 0;
    min-height: 136px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .global-switch-card .field-switch {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    color: var(--fg);
    font-size: 14px;
    font-weight: 600;
  }
  .global-switch-card .switch-slot { flex-shrink: 0; }
  .global-switch-card .field-language,
  .global-switch-card .field-click-action { min-width: 0; color: var(--fg); font-size: 14px; font-weight: 600; }
  .global-switch-card select { width: 100%; box-sizing: border-box; font-weight: 400; }
  .global-switch-card .hint { margin: 10px 0 0; overflow-wrap: anywhere; }
  .field-color { flex: none; }
  .field-threshold { flex: none; width: 110px; }
  .field input[type="text"],
  .field input[type="number"],
  .field textarea,
  .field select,
  .field .color-select {
    min-width: 0;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: inherit;
    font: inherit;
  }
  .field input[type="text"],
  .field input[type="number"],
  .field textarea,
  .field select { width: 100%; }
  .field input:focus,
  .field textarea:focus,
  .field .color-select:focus-visible { outline: none; border-color: var(--accent); }

  /* 第二行：备注，可拖动缩放 */
  .note-row { display: block; }
  .note-row .field { width: 100%; }
  .field textarea.note {
    min-height: 62px;
    resize: vertical;
    line-height: 1.5;
  }

  /* 拨杆字段：文字在上、开关在下，与其他字段同一套排布 */
  .field-switch { flex: none; }
  .field-switch .switch-slot { cursor: pointer; }

  /* iOS 风格拨杆：既能当只读状态指示，也能包在 label 里做开关 */
  .switch-ui {
    position: relative;
    flex: none;
    width: 34px;
    height: 20px;
    border-radius: 999px;
    background: var(--border);
    transition: background 0.15s ease;
  }
  .switch-ui::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    transition: transform 0.15s ease;
  }
  .switch-ui.on { background: var(--accent); }
  .switch-ui.on::after { transform: translateX(14px); }

  .switch-slot {
    position: relative;
    display: flex;
    align-items: center;
    min-height: 37px;
  }
  .switch-slot input {
    position: absolute;
    width: 0;
    height: 0;
    opacity: 0;
  }
  .switch-slot input:checked + .switch-ui { background: var(--accent); }
  .switch-slot input:checked + .switch-ui::after { transform: translateX(14px); }
  .switch-slot input:focus-visible + .switch-ui { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 颜色选择：收起态与展开项都带色块 */
  .color-picker { position: relative; display: inline-block; }
  .color-select {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .color-select:hover { border-color: var(--accent); }
  .color-select .swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0, 0, 0, 0.18); }
  .color-select .caret { color: var(--muted); font-size: 10px; }
  .color-menu {
    position: absolute;
    z-index: 20;
    top: calc(100% + 4px);
    left: 0;
    min-width: 132px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
  }
  .color-menu[hidden] { display: none; }
  .color-option {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 6px 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .color-option:hover { background: var(--panel); }
  .color-option[aria-selected="true"] { background: var(--panel-strong); font-weight: 600; }
  .color-option .swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0, 0, 0, 0.18); }

  .fieldset { margin-bottom: 20px; }
  .fieldset h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); }

  .patterns { display: flex; flex-direction: column; gap: 8px; }
  .pattern-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .pattern-row input {
    flex: 1 1 auto;
    min-width: 0;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: inherit;
    font: 13px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  .pattern-row input:focus { outline: none; border-color: var(--accent); }
  .add-pattern { align-self: flex-start; font-size: 13px; padding: 5px 10px; }

  /* 右栏三段式配置区块 */
  .config-section { border-top: 1px solid var(--divider); }
  .config-section:first-of-type { border-top: 0; }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    padding: 12px 0;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  .section-head:hover { color: var(--accent); }
  .section-title { font-size: 14px; font-weight: 600; }
  .section-status {
    display: inline-flex;
    align-items: center;
    margin-left: auto;
    margin-right: 10px;
  }
  .section-status[hidden] { display: none; }
  .section-status .switch-ui { pointer-events: none; }
  .section-chevron { color: var(--muted); font-size: 12px; transition: transform 0.15s ease; }
  .section-head[aria-expanded="false"] .section-chevron { transform: rotate(-90deg); }
  .section-body { padding-bottom: 18px; }
  .section-body[hidden] { display: none; }

  /* 标签页名规则 */
  .title-rule-controls { display: flex; flex-direction: column; gap: 12px; }
  .title-rule-list { display: flex; flex-direction: column; gap: 10px; }
  .title-rule-card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 12px;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    background: var(--card-bg);
    box-shadow: var(--card-shadow);
  }
  .title-rule-card > .field {
    display: grid;
    grid-template-columns: 100px minmax(0, 1fr);
    align-items: center;
    gap: 12px;
  }
  .title-field-label { white-space: nowrap; }
  .title-rule-head { display: flex; align-items: center; gap: 8px; }
  .title-rule-order {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--panel-strong);
    color: var(--muted);
    font-size: 12px;
  }
  .title-rule-desc {
    flex: 1;
    min-width: 0;
    padding: 4px 6px;
    border: 0;
    border-bottom: 1px dashed var(--border);
    background: transparent;
    color: inherit;
    font: 13px/1.4 inherit;
  }
  .title-rule-desc:focus { outline: none; border-bottom-color: var(--accent); }
  .title-rule-move,
  .title-rule-remove {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    padding: 0;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    box-shadow: none;
    transition: color 0.15s ease, background 0.15s ease;
  }
  .title-rule-move:hover:not(:disabled) {
    color: var(--accent);
    background: var(--mini-btn-bg-hover);
  }
  .title-rule-move:disabled {
    opacity: 0.28;
    cursor: default;
    background: transparent;
  }
  .title-rule-remove { font-size: 15px; }
  .title-rule-remove:hover {
    color: var(--error);
    background: rgba(198, 40, 40, 0.1);
  }
  .add-title-rule { align-self: flex-start; font-size: 13px; padding: 6px 14px; }
  .title-rule-controls .title-rule-url-pattern,
  .title-rule-controls .title-rule-pattern,
  .title-rule-controls .title-rule-replacement {
    min-width: 0;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: inherit;
    font: 13px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  .title-rule-controls .title-rule-url-pattern:focus,
  .title-rule-controls .title-rule-pattern:focus,
  .title-rule-controls .title-rule-replacement:focus { outline: none; border-color: var(--accent); }
  .title-pattern-frame {
    display: flex;
    align-items: center;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    overflow: hidden;
  }
  .title-pattern-frame:focus-within { border-color: var(--accent); }
  .title-pattern-boundary {
    flex: none;
    padding: 7px 9px;
    color: var(--muted);
    background: var(--panel-strong);
    font: 13px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace;
    user-select: none;
  }
  .title-rule-controls .title-pattern-frame input {
    flex: 1;
    width: 0;
    border: 0;
    border-radius: 0;
  }
  /* 规则未启用时整块置灰 */
  .title-rule-controls.disabled .title-rule-list,
  .title-rule-controls.disabled .add-title-rule,
  .title-rule-controls.disabled .title-test,
  .title-rule-controls.disabled .hint {
    opacity: 0.45;
  }
  .title-rule-controls.disabled input,
  .title-rule-controls.disabled button,
  .title-rule-controls.disabled textarea { cursor: not-allowed; }

  .title-test {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-top: 12px;
    border-top: 1px dashed var(--divider);
  }
  .title-test-case { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; margin-bottom: 8px; }
  .title-test-case input { width: 100%; min-width: 0; }
  .title-test-case button { margin-bottom: 2px; }
  @media (max-width: 700px) { .title-test-case { grid-template-columns: 1fr; } }
  .title-test-run { align-self: flex-start; font-size: 13px; padding: 6px 14px; }
  .title-test-output {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 20px;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  .title-test-line { white-space: nowrap; overflow-x: auto; }
  .title-test-src { color: var(--muted); word-break: break-word; }
  .title-test-arrow { color: var(--muted); flex: none; }
  .title-test-dst { color: var(--ok); word-break: break-word; }
  .title-test-dst.warn { color: var(--warn); }

  /* 页面内标识：效果预览 */
  .preview-box {
    position: relative;
    width: 100%;
    max-width: 460px;
    aspect-ratio: 16 / 9;
    margin-bottom: 14px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg);
  }
  .preview-page {
    position: absolute;
    inset: 0;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .preview-page-title { font-size: 12px; font-weight: 600; color: var(--muted); }
  .preview-line { height: 8px; border-radius: 4px; background: var(--panel-strong); }
  .preview-layer { position: absolute; inset: 0; pointer-events: none; }
  .preview-empty {
    position: absolute;
    inset: 0;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 12.5px;
  }
  .preview-box.off .preview-layer { display: none; }
  .preview-empty[hidden] { display: none; }

  /* 页面内标识配置 */
  .highlight-body { display: flex; flex-wrap: wrap; gap: 16px; }
  .highlight-body.disabled { opacity: 0.55; }
  .highlight-block { flex: 1 1 260px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .block-label { font-size: 12.5px; color: var(--muted); }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
  .check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .highlight-nums { display: flex; flex-wrap: wrap; gap: 10px; }
  .highlight-nums .field { width: 92px; }
  .highlight-controls .field-switch { margin-bottom: 10px; }

  /* “规划中”的配置项：用列表行呈现，不额外加框 */
  .future { border-top: 1px dashed var(--border); padding-top: 14px; }
  .future-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px dashed var(--border);
    color: var(--muted);
    font-size: 13px;
  }
  .future-row:last-child { border-bottom: 0; }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); }

  .empty { padding: 32px 8px; text-align: center; color: var(--muted); }

  /* ---------- 状态区：放在标题行，插件名与版本号后面 ---------- */
  .status {
    flex: 1 1 320px;
    min-width: 0;
    margin: 0;
    padding: 0 0 0 10px;
    border-left: 2px solid var(--border);
    font-size: 13px;
  }
  .status:empty { display: none; }
  .status p { margin: 0; }
  .status ul { margin: 4px 0 0; padding-left: 18px; }
  .status li { margin-bottom: 2px; word-break: break-word; }
  .status.ok { border-left-color: var(--ok); color: var(--ok); }
  .status.warn { border-left-color: var(--warn); color: var(--warn); }
  .status.error { border-left-color: var(--error); color: var(--error); }
  .status.info { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>TabPilot 设置</h1>
    <span class="version" id="version"></span>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </header>

  <div class="toolbar">
    <span class="spacer"></span>
    <button id="save" class="primary" type="button" disabled>保存并同步</button>
    <button id="reload" type="button" disabled>放弃修改</button>
  </div>

  <div class="layout">
    <aside class="groups">
      <ul id="globalList" class="global-list"></ul>
      <div class="panel-head">
        <h2>分组</h2>
        <div class="add-rule-control">
          <button id="addRule" class="icon" type="button" title="添加分组规则" aria-label="添加分组规则" aria-haspopup="menu" aria-expanded="false" aria-controls="addRuleMenu">＋ ▾</button>
          <div id="addRuleMenu" class="add-rule-menu" role="menu" hidden>
            <button id="addBlankRule" type="button" role="menuitem">新建空白规则</button>
            <button id="rulesFromWindow" type="button" role="menuitem">从当前窗口分组创建规则</button>
          </div>
        </div>
      </div>
      <ul id="groupList" class="group-list"></ul>
      <p class="hint small">
        顶部「全局配置」管理语言和配置导入导出；下方分组列表用于选中分组，重命名、改颜色、启用 / 停用在右侧完成。可拖拽调整顺序；⋯ 菜单可以复制、调整顺序或删除。
      </p>
    </aside>

    <section class="detail" id="detail"></section>
  </div>
</main>
<script src="options.js"></script>
</body>
</html>
